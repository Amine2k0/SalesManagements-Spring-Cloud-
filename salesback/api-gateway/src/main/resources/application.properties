spring.application.name=api-gateway
server.port=${SERVER_PORT:8989}

# Service discovery
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true

# Routes resolve through Consul with lb://, so a service can move, scale or change
# port without touching this file. They used to be pinned to http://localhost:899x,
# which meant discovery was registered but never actually used for routing.
spring.cloud.gateway.routes[0].id=microservice1
spring.cloud.gateway.routes[0].uri=lb://MicroService1
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/produits/**

spring.cloud.gateway.routes[1].id=microservice2
spring.cloud.gateway.routes[1].uri=lb://MicroService2
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/clients/**

spring.cloud.gateway.routes[2].id=microservice3
spring.cloud.gateway.routes[2].uri=lb://MicroService3
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/ventes/**

spring.cloud.gateway.routes[3].id=microserviceauth
spring.cloud.gateway.routes[3].uri=lb://MicroServiceAuth
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/auth/**

# Off so the only routes are the four above; enabling it also exposes every
# registered service at /{serviceId}/**.
spring.cloud.gateway.discovery.locator.enabled=false

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=${CORS_ORIGINS:http://localhost:4200}
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=Content-Type,Authorization
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
