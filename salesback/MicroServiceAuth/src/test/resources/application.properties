# The context test runs standalone: in-memory database, no Consul agent.
spring.datasource.url=jdbc:h2:mem:sales;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.cloud.consul.enabled=false

jwt.secret=test-secret-that-is-long-enough-for-hs256
jwt.expiration-ms=36000000
