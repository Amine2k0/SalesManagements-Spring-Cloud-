spring.application.name=MicroServiceAuth
server.port=${SERVER_PORT:8996}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:springbootDB}?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# Service discovery
spring.cloud.consul.host=${CONSUL_HOST:localhost}
spring.cloud.consul.port=${CONSUL_PORT:8500}
spring.cloud.consul.discovery.prefer-ip-address=true

# Signing key for the issued tokens. Must be at least 32 bytes for HS256, and must be
# overridden outside development: every holder of this value can mint valid tokens.
jwt.secret=${JWT_SECRET:change-me-in-production-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}
